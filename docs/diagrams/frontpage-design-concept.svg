  <text x="434" y="643" class="body strong">Baca sumber, bukan hanya judul.</text>
  <text x="434" y="666" class="small quiet">Periksa atribusi, waktu, dan batas informasi.</text>
  <path d="M49 697 H859" stroke="#D5DEDB"/>
