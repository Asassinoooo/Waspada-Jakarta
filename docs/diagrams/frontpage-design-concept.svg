  <rect x="24" y="948" width="398" height="145" rx="10" fill="#FFFFFF"/>
  <text x="45" y="980" font-size="18" class="strong">One memorable entrance</text>
  <text x="45" y="1009" class="body quiet">River reveals; flyover and skyline settle.</text>
  <text x="45" y="1032" class="body quiet">One bounded sequence, no alarm loops.</text>
  <text x="45" y="1066" class="small">Motion disabled: complete static artwork.</text>
  <rect x="436" y="948" width="390" height="145" rx="10" fill="#FFFFFF"/>
  <text x="457" y="980" font-size="18" class="strong">Interaction explains evidence</text>
  <text x="457" y="1009" class="body quiet">Buttons select an educational panel.</text>
  <text x="457" y="1032" class="body quiet">Touch and keyboard get the same content.</text>
  <text x="457" y="1066" class="small">No invented incident, time or source.</text>
  <rect x="840" y="948" width="396" height="145" rx="10" fill="#FFFFFF"/>
  <text x="861" y="980" font-size="18" class="strong">Useful before the animation</text>
  <text x="861" y="1009" class="body quiet">Purpose, mode and browse action stay visible.</text>
  <text x="861" y="1032" class="body quiet">No account, install or permission gate.</text>
  <text x="861" y="1066" class="small">Responsive and accessible static fallback.</text>
  <text x="24" y="1124" class="small quiet">Concept sheet is illustrative, not pixel-perfect UI or performance evidence. No motion is embedded in this SVG.</text>
</svg>
