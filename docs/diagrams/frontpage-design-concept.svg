<svg xmlns="http://www.w3.org/2000/svg" width="1260" height="1140" viewBox="0 0 1260 1140" role="img" aria-labelledby="title desc">
  <title id="title">Waspada Jakarta: proposed desktop and mobile front-page design</title>
  <desc id="desc">Static planning artwork, not a running interface. Desktop pairs a headline and account-free browse action with an abstract Jakarta river, flyover and Monas illustration. Mobile puts actions before artwork. Captions separate the illustration and educational evidence panels from actual reports. Notes describe a future brief city entrance and user-controlled evidence panels, with static reduced-motion fallback.</desc>
