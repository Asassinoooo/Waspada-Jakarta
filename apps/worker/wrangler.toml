name = "waspada-jakarta-api-demo"
main = "src/index.ts"
compatibility_date = "2026-09-24"
compatibility_flags = [ "no_handle_cross_request_promise_resolution" ]
send_metrics = false

[vars]
DATASET_MODE = "demo"
SOURCE_PREVIEW_ENABLED = "true"

[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
invocation_logs = false

# Hosted production (HOSTED-04). Deploy with `npm run deploy:prod`; steps in docs/DEPLOYMENT.md.
# vars, hyperdrive and secrets are non-inheritable in wrangler, so the production values are repeated here.
# Secrets never go in this file: use `wrangler secret put --env production` (see docs/DEPLOYMENT.md).
[env.production]
name = "waspada-jakarta"
# PERF-03 (23 Nov 2026): the public read snapshot. Optional in code, so without it the DB path answers every read.
kv_namespaces = [{ binding = "PUBLIC_SNAPSHOT", id = "85160d4e4f2c461d99b8c84710b466f4" }]

[env.production.vars]
DATASET_MODE = "live"
SOURCE_PREVIEW_ENABLED = "false"
AUTH_ENABLED = "true"
# Production origin (HOSTED-23, 17 Nov 2026). Exact https origin, no trailing slash.
AUTH_APP_ORIGIN = "https://waspada-jakarta.waspada-worker.workers.dev"
# HOSTED-25: the cron below only starts the GitHub Actions ingest (GITHUB_DISPATCH_TOKEN is a secret).
SCHEDULED_MODE = "github_dispatch"
INGEST_DISPATCH_REPO = "Asassinoooo/Waspada-Jakarta"
INGEST_DISPATCH_WORKFLOW = "ingest.yml"
INGEST_DISPATCH_REF = "main"

# Off-peak minutes, every 30 minutes. Each run takes 8 to 16 minutes, so runs do not overlap.
[env.production.triggers]
crons = ["7 * * * *"]

# Hyperdrive config waspada-public (HOSTED-23), query caching ON. Public GET reads only (HOSTED-37).
# Same Neon database as the scheduled ingest (owner decision).
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "7dad8907f83b4ab9b7499e0de586b222"

# HOSTED-37 (owner decision, 18 Nov 2026): no-cache config, same Neon database. Moderation, admin, account/auth,
# pipeline flow and all writes read through it, so a write is visible on the next read (the cached config
# could serve a stale read for up to about a minute).
[[env.production.hyperdrive]]
binding = "FRESH_HYPERDRIVE"
id = "4e16ee874a1349589a764189d54856ba"

# Auth uses the no-cache config too (HOSTED-37): session reads after logout or revoke must not be stale.
# The runtime switches into the NOLOGIN auth role granted by the bootstrap.
[[env.production.hyperdrive]]
binding = "AUTH_HYPERDRIVE"
id = "4e16ee874a1349589a764189d54856ba"

# Static web build served from the same Worker. Every Worker route is under /api/v1/*, so only those
# paths run the Worker; everything else is an asset or, when missing, the SPA index.html.
[env.production.assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
