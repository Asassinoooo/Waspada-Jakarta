name = "waspada-jakarta-api-demo"
main = "src/index.ts"
compatibility_date = "2026-09-24"
compatibility_flags = [ "no_handle_cross_request_promise_resolution" ]
send_metrics = false

[vars]
DATASET_MODE = "demo"
SOURCE_PREVIEW_ENABLED = "true"

[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
invocation_logs = false

# Hosted production (HOSTED-04). Deploy with `npm run deploy:prod`; steps in docs/DEPLOYMENT.md.
# vars, hyperdrive and secrets are non-inheritable in wrangler, so the production values are repeated here.
# Secrets never go in this file: use `wrangler secret put --env production` (see docs/DEPLOYMENT.md).
[env.production]
name = "waspada-jakarta"

[env.production.vars]
DATASET_MODE = "live"
SOURCE_PREVIEW_ENABLED = "false"
AUTH_ENABLED = "true"
# OWNER: replace the placeholder with this Worker's exact https workers.dev origin (no trailing slash).
AUTH_APP_ORIGIN = "https://waspada-jakarta.REPLACE-ME.workers.dev"

# OWNER: run `npx wrangler hyperdrive create ...` against the Neon Free `main` branch and paste its id here.
[[env.production.hyperdrive]]
binding = "HYPERDRIVE"
id = "REPLACE_WITH_HYPERDRIVE_ID"

# OWNER: second Hyperdrive config for the dedicated auth DB role (separate from the public/ingest role).
[[env.production.hyperdrive]]
binding = "AUTH_HYPERDRIVE"
id = "REPLACE_WITH_AUTH_HYPERDRIVE_ID"

# Static web build served from the same Worker. Every Worker route is under /api/v1/*, so only those
# paths run the Worker; everything else is an asset or, when missing, the SPA index.html.
[env.production.assets]
directory = "../web/dist"
run_worker_first = ["/api/*"]
not_found_handling = "single-page-application"
