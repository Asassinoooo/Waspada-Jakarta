name = "waspada-jakarta-api-demo"
main = "src/index.ts"
compatibility_date = "2026-09-24"
compatibility_flags = [ "no_handle_cross_request_promise_resolution" ]
send_metrics = false

[vars]
DATASET_MODE = "demo"
SOURCE_PREVIEW_ENABLED = "true"

[observability]
enabled = true
head_sampling_rate = 0.01

[observability.logs]
invocation_logs = false
