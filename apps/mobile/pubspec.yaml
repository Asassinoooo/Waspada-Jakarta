name: waspada_jakarta_mobile
description: Public information reader for Waspada Jakarta.
publish_to: none
version: 0.2.0+2

environment:
  sdk: '>=3.8.0 <4.0.0'
  flutter: '>=3.19.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.5.0
  shared_preferences: ^2.5.3
  unorm_dart: 0.3.2
  flutter_map: ^8.3.2
  latlong2: ^0.10.1
  flutter_localizations:
    sdk: flutter
  workmanager: 0.10.10
  flutter_local_notifications: 19.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  # MOBILE-V2: Plus Jakarta Sans (SIL OFL 1.1, assets/fonts/OFL.txt), bundled so no font is fetched at runtime.
  fonts:
    - family: PlusJakartaSans
      fonts:
        - asset: assets/fonts/PlusJakartaSans-Regular.ttf
          weight: 400
        - asset: assets/fonts/PlusJakartaSans-Medium.ttf
          weight: 500
        - asset: assets/fonts/PlusJakartaSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/PlusJakartaSans-Bold.ttf
          weight: 700
        - asset: assets/fonts/PlusJakartaSans-ExtraBold.ttf
          weight: 800
