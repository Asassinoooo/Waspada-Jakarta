name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Database Tests
        run: npm run db:test

      - name: Run Web Tests
        run: npm run test --workspace=@waspada/web

      - name: Run Worker Tests
        run: npm run test --workspace=@waspada/worker

      - name: Run Intelligence Tests
        run: npm run test:intelligence

      - name: Build Web and Worker Bundles
        run: npm run build
