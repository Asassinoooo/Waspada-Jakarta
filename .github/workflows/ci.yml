name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Run Database Tests
        run: npm run db:test

      - name: Run Web Tests
        run: npm run test --workspace=@waspada/web

      - name: Run Worker Tests
        run: npm run test --workspace=@waspada/worker

      - name: Run Intelligence Tests
        run: npm run test:intelligence

      - name: Run Pipeline Tests
        run: npm run pipeline:test

      - name: Run Accounts Tests
        run: npm run accounts:test

      - name: Run Evaluation and AI Tool Tests
        run: npx tsx --test tools/evaluation/casebook.test.ts tools/evaluation/casebook-cli.test.ts tools/ai/ninerouter-smoke.test.ts tools/ai/ninerouter-cli.test.ts tools/ai/extraction-probe.test.ts tools/live-db-lock.test.ts tools/live-db-restore.test.ts

      - name: Build Web and Worker Bundles
        run: npm run build
